# yaml-language-server: $schema=../schema/helia-platforms-v1.schema.json
# Shorthands (RFC 0002): members are Soc ids from nsx-ambiq-sdk's apollo5 series.
# Compositions: legacy board ids and kit part numbers that name a board fitted with add-ons.
schema_version: 1
shorthands:
  AP5: [apollo510, apollo510b, apollo510L]
  AP510: [apollo510, apollo510b, apollo510L]
compositions:
  # neuralspotx's apollo3p_evb_cygnus board: the EVB with the Cygnus board on MSPI1 (#67).
  apollo3p_evb_cygnus: {board: apollo3p_evb, addons: [cygnus]}
  # Both Display Kit names resolve to GPIO34's hex setting, which nsx-psram builds for this
  # board by default (modules/nsx-psram/CMakeLists.txt:42-44 at v5.2.27). The octal setting
  # is apollo4p_evb with the add-on apollo4p_disp_shield (QS-A4PDK p11).
  apollo4p_evb_disp_shield_rev2: {board: apollo4p_evb, addons: [apollo4p_disp_shield_hex]}
  # The Display Kit's part number: the EVB and the shield (QS-A4PDK p18).
  AMAP4PDISP: {board: apollo4p_evb, addons: [apollo4p_disp_shield_hex]}
