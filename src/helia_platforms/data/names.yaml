# yaml-language-server: $schema=../schema/helia-platforms-v1.schema.json
# Shorthands (RFC 0002): members are Soc ids from nsx-ambiq-sdk's apollo5 series.
# Compositions: legacy board ids and kit part numbers that name a board fitted with add-ons.
schema_version: 1
shorthands:
  AP5: [apollo510]
  AP510: [apollo510]
compositions:
  apollo4p_evb_disp_shield_rev2: {board: apollo4p_evb, addons: [apollo4p_disp_shield]}
  # The Display Kit's part number: the EVB and the shield (QS-A4PDK p18).
  AMAP4PDISP: {board: apollo4p_evb, addons: [apollo4p_disp_shield]}
