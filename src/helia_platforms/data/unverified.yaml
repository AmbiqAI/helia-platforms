# yaml-language-server: $schema=../schema/helia-platforms-v1.schema.json
# The release allow-list (ADR 0003 section 4): built-in values that may stay unverified.
schema_version: 1
unverified_allowed:
  - fact: "fact:soc:atomiq110:memories.hblram.technology"
    reason: "no source states HBLRAM's technology, and the consumers disagree"
    issue: "#19"
  - fact: "fact:soc:atomiq110:memories.hblram.attachment"
    reason: "only helia-estimator says HBLRAM is in the package"
    issue: "#19"
  - fact: "fact:soc:atomiq110:access.cm55_0@hblram"
    reason: "only the consumers say the CPU reaches HBLRAM"
    issue: "#19"
  - fact: "fact:soc:atomiq110:access.npu_0@ssram"
    reason: "the NPU's reach and port class come from helia-npu only"
    issue: "#19"
  - fact: "fact:soc:atomiq110:access.npu_0@hblram"
    reason: "the NPU's reach and port class come from helia-npu only"
    issue: "#19"
  - fact: "fact:soc:atomiq110:access.npu_0@rram"
    reason: "the NPU's reach and port class come from helia-npu only"
    issue: "#19"
  - fact: "fact:soc:atomiq110:npus.npu_0.sram_port_hash"
    reason: "measured on the FPGA by helia-npu's maintainers; no record of the method is public"
    issue: "#19"
  - fact: "fact:implementation:atomiq110_fpga:subset.peripherals_removed"
    reason: "the FPGA's IOM set is only in AmbiqSuite, and the shipped BSP pins disagree"
    issue: "#19"
  - fact: "fact:implementation:atomiq110_fpga:subset.clock_domains_removed"
    reason: "the FPGA's clocks are the helia-estimator owner's statement, with no document"
    issue: "#68"
  - fact: "fact:implementation:atomiq110_fpga:clock_domains.cpu.hp"
    reason: "the helia-estimator owner's statement; nsx-core says the FPGA's clock is fixed at 25 MHz"
    issue: "#68"
  - fact: "fact:implementation:atomiq110_fpga:clock_domains.npu.ulp"
    reason: "the helia-estimator owner's statement, with no document"
    issue: "#68"
  - fact: "fact:implementation:atomiq110_fpga:subset.operating_points_removed"
    reason: "the FPGA's clocks are the helia-estimator owner's statement, with no document"
    issue: "#68"
  - fact: "fact:implementation:atomiq110_fpga:clock_domains.npu.hp"
    reason: "the helia-estimator owner's statement, with no document"
    issue: "#68"
