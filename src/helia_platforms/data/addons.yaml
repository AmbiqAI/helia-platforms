# yaml-language-server: $schema=../schema/helia-platforms-v1.schema.json
# Add-ons shared across boards (ADR 0002 section 1).
schema_version: 1
addons:
  apollo4p_disp_shield:
    release_status: public
    aliases: [AMAP4PDISP]
    revision:
      value: "1"
      provenance:
        status: datasheet
        source: ["doc:QS-A4PDK@1.2:p18"]
        verified_on: 2026-10-08
        verified_by: evanchen11
        notes: >-
          "AMAP4PDISP EVB Rev. 2 / Shield Rev. 1". The _rev2 in the legacy board id
          apollo4p_evb_disp_shield_rev2 is the EVB revision, not the shield's (decided on #66).
    fits_boards: [apollo4p_evb]
    occupies: [mspi0, mspi1, mspi2]
    population:
      mspi0: APS256XXN
      mspi1: IS25WX064
    provenance:
      status: datasheet
      source:
        - "doc:QS-A4PDK@1.2:p6"
        - "doc:QS-A4PDK@1.2:p10"
        - "doc:QS-A4PDK@1.2:p11"
        - "doc:QS-A4PDK@1.2:p12"
      verified_on: 2026-10-08
      verified_by: evanchen11
      notes: >-
        Apollo4 Plus Display Kit, "part number AMAP4PDISP" (p6), "only compatible with the
        (non-blue) Apollo4 Plus EVB", revision 2 or later (p10). GPIO34 selects MSPI0 hex to
        the PSRAM only (p10), or MSPI0 and MSPI1 octal to the PSRAM and the flash (p11), so
        the flash is reachable only in the octal setting. Both figures wire the display to
        Quad-MSPI2, a figure label only. The 4 GB eMMC THGBMNG5D1LBAIT (p12) is not modelled.
