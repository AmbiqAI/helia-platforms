# yaml-language-server: $schema=../schema/helia-platforms-v1.schema.json
# Core IP blocks (ADR 0002 section 1).
schema_version: 1
cores:
  cortex-m55:
    arch: armv8.1-m
    pmu:
      value: armv8m
      provenance:
        status: sdk
        source: ["repo:AmbiqAI/nsx-ambiq-sdk@v5.2.27:cmake/socs/facts/apollo510.cmake:18"]
        verified_on: 2026-10-13
        verified_by: evanchen11
        notes: >-
          NSX_SOC_PMU_TIER "armv8m". DS-A510 p27 describes the PMU but names no tier;
          the tier names are ADR 0006's.
    has_dsp_extension: true
    pmu_extension:
      event_counters: 8
      event_counter_bits: 16
      cycle_counter_bits: 32
      odd_counters_chain: true
      events:  # Table 17-1, in the table's order
        SW_INCR: 0x0000
        L1I_CACHE_REFILL: 0x0001
        L1D_CACHE_REFILL: 0x0003
        L1D_CACHE: 0x0004
        LD_RETIRED: 0x0006
        ST_RETIRED: 0x0007
        INST_RETIRED: 0x0008
        EXC_TAKEN: 0x0009
        EXC_RETURN: 0x000A
        PC_WRITE_RETIRED: 0x000C
        BR_IMMED_RETIRED: 0x000D
        BR_RETURN_RETIRED: 0x000E
        UNALIGNED_LDST_RETIRED: 0x000F
        CPU_CYCLES: 0x0011
        MEM_ACCESS: 0x0013
        L1I_CACHE: 0x0014
        L1D_CACHE_WB: 0x0015
        BUS_ACCESS: 0x0019
        MEMORY_ERROR: 0x001A
        BUS_CYCLES: 0x001D
        CHAIN: 0x001E
        BR_RETIRED: 0x0021
        BR_MIS_PRED_RETIRED: 0x0022
        STALL_FRONTEND: 0x0023
        STALL_BACKEND: 0x0024
        LL_CACHE_RD: 0x0036
        LL_CACHE_MISS_RD: 0x0037
        L1D_CACHE_MISS_RD: 0x0039
        STALL: 0x003C
        L1D_CACHE_RD: 0x0040
        LE_RETIRED: 0x0100
        LE_CANCEL: 0x0108
        SE_CALL_S: 0x0114
        SE_CALL_NS: 0x0115
        DWT_CMPMATCH0: 0x0118
        DWT_CMPMATCH1: 0x0119
        DWT_CMPMATCH2: 0x011A
        DWT_CMPMATCH3: 0x011B
        DWT_CMPMATCH4: 0x011C
        DWT_CMPMATCH5: 0x011D
        DWT_CMPMATCH6: 0x011E
        DWT_CMPMATCH7: 0x011F
        MVE_INST_RETIRED: 0x0200
        MVE_FP_RETIRED: 0x0204
        MVE_FP_HP_RETIRED: 0x0208
        MVE_FP_SP_RETIRED: 0x020C
        MVE_FP_MAC_RETIRED: 0x0214
        MVE_INT_RETIRED: 0x0224
        MVE_INT_MAC_RETIRED: 0x0228
        MVE_LDST_RETIRED: 0x0238
        MVE_LD_RETIRED: 0x023C
        MVE_ST_RETIRED: 0x0240
        MVE_LDST_CONTIG_RETIRED: 0x0244
        MVE_LD_CONTIG_RETIRED: 0x0248
        MVE_ST_CONTIG_RETIRED: 0x024C
        MVE_LDST_NONCONTIG_RETIRED: 0x0250
        MVE_LD_NONCONTIG_RETIRED: 0x0254
        MVE_ST_NONCONTIG_RETIRED: 0x0258
        MVE_LDST_MULTI_RETIRED: 0x025C
        MVE_LD_MULTI_RETIRED: 0x0260
        MVE_ST_MULTI_RETIRED: 0x0264
        MVE_LDST_UNALIGNED_RETIRED: 0x028C
        MVE_LD_UNALIGNED_RETIRED: 0x0290
        MVE_ST_UNALIGNED_RETIRED: 0x0294
        MVE_LDST_UNALIGNED_NONCONTIG_RETIRED: 0x0298
        MVE_VREDUCE_RETIRED: 0x02A0
        MVE_VREDUCE_FP_RETIRED: 0x02A4
        MVE_VREDUCE_INT_RETIRED: 0x02A8
        MVE_PRED: 0x02B8
