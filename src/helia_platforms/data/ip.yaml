        CDE_VCX2_INST_RETIRED: 0xC40C
        CDE_VCX3_INST_RETIRED: 0xC40E
        CDE_VCX1_VEC_INST_RETIRED: 0xC410
        CDE_VCX2_VEC_INST_RETIRED: 0xC412
        CDE_VCX3_VEC_INST_RETIRED: 0xC414
        CDE_PRED: 0xC416
        CDE_STALL: 0xC417
        CDE_STALL_RESOURCE: 0xC418
        CDE_STALL_DEPENDENCY: 0xC419
        CDE_STALL_CUSTOM: 0xC41A
        CDE_STALL_OTHER: 0xC41B
        PF_LF_LA_1: 0xC41C
        PF_LF_LA_2: 0xC41D
        PF_LF_LA_3: 0xC41E
        PF_LF_LA_4: 0xC41F
        PF_LF_LA_5: 0xC420
        PF_LF_LA_6: 0xC421
        PF_BUFFER_FULL: 0xC422
        PF_BUFFER_MISS: 0xC423
        PF_BUFFER_HIT: 0xC424
      provenance:
        status: datasheet
        source:
          - "doc:TRM-M55@r1p1-02:p265"
          - "doc:TRM-M55@r1p1-02:p266-270"
          - "doc:TRM-M55@r1p1-02:p44"
        verified_on: 2026-11-13
        verified_by: evanchen11
        notes: >-
          p265: "eight 16-bit event counters and one 32-bit cycle counter"; "Only odd event
          counters support the chain feature", which cascades two 16-bit counters into one
          32-bit counter. p266: the PMU is present when the DWT is. event_counters is the
          count the TRM documents; p44 says the implementer's debug configuration controls
          how many counters are present, and the TRM gives no other count.
    provenance:
      status: datasheet
      source: ["doc:DS-A510@1.1.0:p21"]
      verified_on: 2026-10-13
      verified_by: evanchen11
      notes: >-
        "Armv8.1-M ISA with DSP and Security Extensions". nsx-ambiq-sdk
        facts/apollo510.cmake:13 and :15 agree.
  cortex-m4:
    arch:
      value: armv7e-m
      provenance:
        status: derived
        source: ["doc:DS-A510LS@0.9.0:p55", "repo:AmbiqAI/nsx-ambiq-sdk@v5.2.27:cmake/socs/facts/apollo4p.cmake:11", "repo:AmbiqAI/nsx-ambiq-sdk@v5.2.27:cmake/socs/facts/apollo3.cmake:11"]
        verified_on: 2026-10-28
        verified_by: evanchen11
        notes: >-
          DS-A510LS p55: "Arm v7-M architecture" with the DSP extension, which is Armv7E-M.
          For Apollo4's and Apollo3's application cores the SDK gives NSX_SOC_ARCH_CLASS
          "armv7e_m" (apollo4p.cmake:11, apollo3.cmake:11).
    pmu:
      value: dwt
      provenance:
        status: sdk
        source:
          - "repo:AmbiqAI/nsx-ambiq-sdk@v5.2.27:modules/nsx-ambiqsuite/sdk/CMSIS/AmbiqMicro/Include/apollo510L_cm4.h:175"
          - "repo:AmbiqAI/nsx-ambiq-sdk@v5.2.27:modules/nsx-cmsis-core/Include/core_cm4.h:1552"
          - "repo:AmbiqAI/nsx-ambiq-sdk@v5.2.27:cmake/socs/facts/apollo4p.cmake:16"
          - "repo:AmbiqAI/nsx-ambiq-sdk@v5.2.27:cmake/socs/facts/apollo3.cmake:16"
        verified_on: 2026-10-28
        verified_by: evanchen11
        notes: >-
          The Apollo510 Lite radio core's CMSIS header gives __PMU_PRESENT 0, and core_cm4.h
          maps a DWT at 0xE0001000 (DWT_BASE); apollo4p.cmake:16 and apollo3.cmake:16 give
          NSX_SOC_PMU_TIER "none". ADR 0006 spells a DWT-only tier dwt.
    has_dsp_extension: true
    provenance:
      status: datasheet
      source:
        - "doc:DS-A510LS@0.9.0:p55"
        - "repo:AmbiqAI/nsx-ambiq-sdk@v5.2.27:modules/nsx-ambiqsuite/sdk/CMSIS/AmbiqMicro/Include/apollo510L_cm4.h:170"
        - "repo:AmbiqAI/nsx-ambiq-sdk@v5.2.27:cmake/socs/facts/apollo4p.cmake:13"
        - "repo:AmbiqAI/nsx-ambiq-sdk@v5.2.27:cmake/socs/facts/apollo3.cmake:13"
      verified_on: 2026-10-28
      verified_by: evanchen11
      notes: >-
        p55, the Apollo510 Lite radio core: "The CM4 supports the DSP and Security ISA
        extensions". apollo510L_cm4.h gives __DSP_PRESENT 0, a macro core_cm4.h does not
        read. apollo4p.cmake:13 and apollo3.cmake:13 give NSX_SOC_HAS_DSP TRUE for the
        Apollo4 and Apollo3 application cores.
  cortex-m0:
    arch:
      value: armv6-m
      provenance:
        status: derived
        source:
          - "doc:DS-A4BP@1.8.0:p96"
          - "doc:DS-A4BL@0.9.0:p84"
          - "repo:AmbiqAI/nsx-ambiq-sdk@v5.2.27:modules/nsx-cmsis-core/Include/core_cm0.h:67"
          - "repo:AmbiqAI/nsx-ambiq-sdk@v5.2.27:modules/nsx-cmsis-core/Include/core_cm0.h:624"
        verified_on: 2026-10-29
        verified_by: evanchen11
        notes: >-
          The Apollo4 Blue Plus (DS-A4BP p96) and Blue Lite (DS-A4BL p84) BLE controller
          "incorporates a dedicated Arm Cortex-M0 processor". core_cm0.h, the CMSIS header
          for that core, defines __CORTEX_M (0U) (:67) and reads "Interrupt Priorities are
          WORD accessible only under Armv6-M" (:624).
    pmu: none
    has_dsp_extension: false
    provenance:
      status: sdk
      source: ["repo:AmbiqAI/nsx-ambiq-sdk@v5.2.27:modules/nsx-cmsis-core/Include/core_cm0.h:535-542"]
      verified_on: 2026-10-28
      verified_by: evanchen11
      notes: >-
        The core map is SysTick, NVIC and SCB only (:535-542), with no DWT or PMU, and
        Armv6-M has no DSP extension. No Soc's SDK facts name this core: it is the BLE
        controller of Apollo4 Blue Plus and Blue Lite (the arch record cites both).
