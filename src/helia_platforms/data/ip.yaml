# yaml-language-server: $schema=../schema/helia-platforms-v1.schema.json
# Core IP blocks (ADR 0002 section 1).
schema_version: 1
cores:
  cortex-m55:
    arch: armv8.1-m
    pmu:
      value: armv8m
      provenance:
        status: sdk
        source: ["repo:AmbiqAI/nsx-ambiq-sdk@v5.2.26:cmake/socs/facts/apollo510.cmake:18"]
        verified_on: 2026-10-13
        verified_by: evanchen11
        notes: >-
          NSX_SOC_PMU_TIER "armv8m". DS-A510 p27 describes the PMU but names no tier;
          the tier names are ADR 0006's.
    has_dsp_extension: true
    provenance:
      status: datasheet
      source: ["doc:DS-A510@1.1.0:p21"]
      verified_on: 2026-10-13
      verified_by: evanchen11
      notes: >-
        "Armv8.1-M ISA with DSP and Security Extensions". The Arm Cortex-M55 TRM is not in
        the register. nsx-ambiq-sdk facts/apollo510.cmake:13 and :15 agree.
  cortex-m4:
    arch:
      value: armv7e-m
      provenance:
        status: derived
        source: ["doc:DS-A510LS@0.9.0:p55", "repo:AmbiqAI/nsx-ambiq-sdk@v5.2.26:cmake/socs/facts/apollo4p.cmake:11", "repo:AmbiqAI/nsx-ambiq-sdk@v5.2.26:cmake/socs/facts/apollo3.cmake:11"]
        verified_on: 2026-10-28
        verified_by: evanchen11
        notes: >-
          DS-A510LS p55: "Arm v7-M architecture" with the DSP extension, which is Armv7E-M.
          For Apollo4's and Apollo3's application cores the SDK gives NSX_SOC_ARCH_CLASS
          "armv7e_m" (apollo4p.cmake:11, apollo3.cmake:11).
    pmu:
      value: dwt
      provenance:
        status: sdk
        source:
          - "repo:AmbiqAI/nsx-ambiq-sdk@v5.2.26:modules/nsx-ambiqsuite/sdk/CMSIS/AmbiqMicro/Include/apollo510L_cm4.h:175"
          - "repo:AmbiqAI/nsx-ambiq-sdk@v5.2.26:modules/nsx-cmsis-core/Include/core_cm4.h:1552"
          - "repo:AmbiqAI/nsx-ambiq-sdk@v5.2.26:cmake/socs/facts/apollo4p.cmake:16"
          - "repo:AmbiqAI/nsx-ambiq-sdk@v5.2.26:cmake/socs/facts/apollo3.cmake:16"
        verified_on: 2026-10-28
        verified_by: evanchen11
        notes: >-
          The Apollo510 Lite radio core's CMSIS header gives __PMU_PRESENT 0, and core_cm4.h
          maps a DWT at 0xE0001000 (DWT_BASE); apollo4p.cmake:16 and apollo3.cmake:16 give
          NSX_SOC_PMU_TIER "none". ADR 0006 spells a DWT-only tier dwt.
    has_dsp_extension: true
    provenance:
      status: datasheet
      source:
        - "doc:DS-A510LS@0.9.0:p55"
        - "repo:AmbiqAI/nsx-ambiq-sdk@v5.2.26:modules/nsx-ambiqsuite/sdk/CMSIS/AmbiqMicro/Include/apollo510L_cm4.h:170"
        - "repo:AmbiqAI/nsx-ambiq-sdk@v5.2.26:cmake/socs/facts/apollo4p.cmake:13"
        - "repo:AmbiqAI/nsx-ambiq-sdk@v5.2.26:cmake/socs/facts/apollo3.cmake:13"
      verified_on: 2026-10-28
      verified_by: evanchen11
      notes: >-
        p55, the Apollo510 Lite radio core: "The CM4 supports the DSP and Security ISA
        extensions". apollo510L_cm4.h gives __DSP_PRESENT 0, a macro core_cm4.h does not
        read. apollo4p.cmake:13 and apollo3.cmake:13 give NSX_SOC_HAS_DSP TRUE for the
        Apollo4 and Apollo3 application cores.
  cortex-m0:
    arch:
      value: armv6-m
      provenance:
        status: derived
        source:
          - "doc:DS-A4BP@1.8.0:p96"
          - "doc:DS-A4BL@0.9.0:p84"
          - "repo:AmbiqAI/nsx-ambiq-sdk@v5.2.26:modules/nsx-cmsis-core/Include/core_cm0.h:67"
          - "repo:AmbiqAI/nsx-ambiq-sdk@v5.2.26:modules/nsx-cmsis-core/Include/core_cm0.h:624"
        verified_on: 2026-10-29
        verified_by: evanchen11
        notes: >-
          The Apollo4 Blue Plus (DS-A4BP p96) and Blue Lite (DS-A4BL p84) BLE controller
          "incorporates a dedicated Arm Cortex-M0 processor". core_cm0.h, the CMSIS header
          for that core, defines __CORTEX_M (0U) (:67) and reads "Interrupt Priorities are
          WORD accessible only under Armv6-M" (:624).
    pmu: none
    has_dsp_extension: false
    provenance:
      status: sdk
      source: ["repo:AmbiqAI/nsx-ambiq-sdk@v5.2.26:modules/nsx-cmsis-core/Include/core_cm0.h:535-542"]
      verified_on: 2026-10-28
      verified_by: evanchen11
      notes: >-
        The core map is SysTick, NVIC and SCB only (:535-542), with no DWT or PMU, and
        Armv6-M has no DSP extension. No Soc's SDK facts name this core: it is the BLE
        controller of Apollo4 Blue Plus and Blue Lite (the arch record cites both).
