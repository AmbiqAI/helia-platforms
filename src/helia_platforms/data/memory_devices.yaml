# yaml-language-server: $schema=../schema/helia-platforms-v1.schema.json
# Memory devices shared across boards (ADR 0002 section 1).
schema_version: 1
memory_devices:
  APS512XX:
    release_status: public
    technology: psram
    provenance:
      status: datasheet
      source: ["doc:QS-A510@2.1:p8"]
      verified_on: 2026-10-08
      verified_by: evanchen11
      notes: >-
        "MSPI x16 (Hex) PSRAM (AP Memory APS512XXN-AOB4BI-WBRZ)". The id is the stem of
        both markings in QS-A510 (p8, p10).
    capacity:
      value: 64M
      provenance:
        status: measured
        source:
          - "meas:apollo510_evb/xip-alias/2026-07-05"
          - "repo:AmbiqAI/nsx-ambiq-sdk@v5.2.26:modules/nsx-psram/CMakeLists.txt:106-110"
        verified_on: 2026-10-13
        verified_by: evanchen11
        notes: >-
          Measured by apage224 and added in AmbiqAI/nsx-ambiq-sdk#38: heliaPROFILER ran a
          model from PSRAM XIP, and XIP address aliasing showed 512 Mbit = 64 MB ("+32 MB
          holds distinct data; +64 MB falls off the MSPI aperture"). No document states
          the capacity.
    driver_family:
      value: aps25616ba
      provenance:
        status: sdk
        source:
          - "repo:AmbiqAI/nsx-ambiq-sdk@v5.2.26:modules/nsx-ambiqsuite/sdk/boards/apollo510_evb/bsp/am_bsp.h:188"
          - "repo:AmbiqAI/nsx-ambiq-sdk@v5.2.26:modules/nsx-psram/CMakeLists.txt:123-131"
        verified_on: 2026-10-13
        verified_by: evanchen11
        notes: >-
          The BSP defines AM_BSP_MSPI_PSRAM_DEVICE_APS25616BA, and nsx-psram builds the
          1.2 V "BA" driver am_devices_mspi_psram_aps25616ba_1p2v.c for this board. The
          part marking is not the driver family (CMakeLists.txt:99-104).
    modes:
      value: [hex-ddr]
      provenance:
        status: sdk
        source:
          - "repo:AmbiqAI/nsx-ambiq-sdk@v5.2.26:modules/nsx-psram/CMakeLists.txt:60-64"
        verified_on: 2026-10-13
        verified_by: evanchen11
        notes: "\"Hex (x16) DDR PSRAM on MSPI0\". QS-A510 p8 states x16 (Hex); DS-A510 p95 states DDR on MSPI0."
  APS6404L:
    release_status: public
    technology: psram
    provenance:
      status: sdk
      source: ["repo:AmbiqAI/nsx-ambiq-sdk@v5.2.26:modules/nsx-psram/CMakeLists.txt:26"]
      verified_on: 2026-10-26
      verified_by: evanchen11
      notes: >-
        nsx-psram builds am_devices_mspi_psram_aps6404l.c for the Apollo3 Blue Plus PSRAM
        boards. No datasheet for the part is in the register.
    capacity:
      value: 8M
      provenance:
        status: sdk
        source:
          - "repo:AmbiqAI/nsx-ambiq-sdk@v5.2.26:modules/nsx-psram/CMakeLists.txt:27-29"
          - "repo:zephyrproject-rtos/zephyr@8f62a4ab82b5c2121c088842d3233f75b603ce35:samples/drivers/memc/boards/apollo3p_evb.overlay:36"
          - "repo:zephyrproject-rtos/zephyr@8f62a4ab82b5c2121c088842d3233f75b603ce35:drivers/memc/memc_mspi_aps6404l.c:438"
        verified_on: 2026-10-26
        verified_by: evanchen11
        notes: >-
          nsx-psram's default NSX_PSRAM_DEVICE_SIZE_BYTES 8388608; Zephyr's DT_SIZE_M(64)
          is in bits, and the driver divides it by 8. Nothing was measured.
    driver_family:
      value: aps6404l
      provenance:
        status: sdk
        source: ["repo:AmbiqAI/nsx-ambiq-sdk@v5.2.26:modules/nsx-psram/CMakeLists.txt:26"]
        verified_on: 2026-10-26
        verified_by: evanchen11
    modes:
      value: [quad-sdr]
      provenance:
        status: sdk
        source:
          - "repo:AmbiqAI/nsx-ambiq-sdk@v5.2.26:modules/nsx-psram/src/apollo3/nsx_psram.c:105"
          - "repo:zephyrproject-rtos/zephyr@8f62a4ab82b5c2121c088842d3233f75b603ce35:samples/drivers/memc/boards/apollo3p_evb.overlay:40-41"
        verified_on: 2026-10-26
        verified_by: evanchen11
        notes: AM_HAL_MSPI_FLASH_QUAD_CE0; Zephyr's MSPI_IO_MODE_QUAD and MSPI_DATA_RATE_SINGLE.
