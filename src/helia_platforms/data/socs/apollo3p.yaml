# yaml-language-server: $schema=../../schema/helia-platforms-v1.schema.json
# The apollo3p Soc (Apollo3 Blue Plus), its part and its board. Owner decisions: #67.
schema_version: 1
socs:
  apollo3p:
    release_status: public
    default_board: apollo3p_evb
    provenance:
      status: datasheet
      source: ["doc:DS-A3P@1.3.0:p2", "doc:DS-A3P@1.3.0:p82", "doc:DS-A3P@1.3.0:p177"]
      verified_on: 2026-10-08
      verified_by: evanchen11
      notes: >-
        Which cores, memory regions, clock modes and boot configurations the Soc has: one
        Cortex-M4F with 48 MHz nominal and 96 MHz TurboSPOT clocks (p2), the memory map
        (p82) and secure boot (p177).
    series:
      value: apollo3
      provenance:
        status: sdk
        source: ["repo:AmbiqAI/nsx-ambiq-sdk@v5.2.26:cmake/socs/facts/apollo3p.cmake:8"]
        verified_on: 2026-10-26
        verified_by: evanchen11

    cores:
      - id: cm4_0
        role: application
        core: cortex-m4
        clock_domain: cpu
        programmable_by:
          value: customer
          provenance:
            status: sdk
            source:
              - "repo:AmbiqAI/nsx-ambiq-sdk@v5.2.26:modules/nsx-core/src/apollo3p/gcc/linker_script.ld:10"
              - "repo:AmbiqAI/nsx-ambiq-sdk@v5.2.26:modules/nsx-ambiqsuite/sdk/mcu/apollo3p/hal/am_hal_flash.h:93"
            verified_on: 2026-10-26
            verified_by: evanchen11
            notes: The default linker script places the application in flash at 0xC000.
        provenance:
          status: datasheet
          source: ["doc:DS-A3P@1.3.0:p2"]
          verified_on: 2026-10-08
          verified_by: evanchen11
          notes: >-
            "High-performance ARM Cortex-M4 Processor". p2 also gives the BLE controller "a
            dedicated second core"; that it is the application core is the catalog's reading.
        options:
          fpu:
            value: fpv4-sp-d16
            provenance:
              status: sdk
              source: ["repo:AmbiqAI/nsx-ambiq-sdk@v5.2.26:cmake/socs/facts/apollo3p.cmake:25"]
              verified_on: 2026-10-26
              verified_by: evanchen11
              notes: DS-A3P p2 says "Floating point unit" and names no architecture or precision.
          fpu_dp: false
          mve: none
          provenance:
            status: sdk
            source:
              - "repo:AmbiqAI/nsx-ambiq-sdk@v5.2.26:cmake/socs/facts/apollo3p.cmake:14"
              - "repo:AmbiqAI/nsx-ambiq-sdk@v5.2.26:modules/nsx-ambiqsuite/sdk/CMSIS/AmbiqMicro/Include/apollo3p.h:136"
            verified_on: 2026-10-26
            verified_by: evanchen11
            notes: >-
              NSX_SOC_HAS_MVE FALSE and __FPU_DP 0. The 16 KB cache on DS-A3P p2 is the flash
              cache (CACHECTRL), not a core cache, so icache_kb and dcache_kb are absent.

    memories:
      tcm:
        technology: sram
        attachment: tcm
        base: 0x10000000
        size: 64K
        executable: true
        provenance: &ds_map
          status: datasheet
          source: ["doc:DS-A3P@1.3.0:p82"]
          verified_on: 2026-10-08
          verified_by: evanchen11
          notes: >-
            Table 5 "MCU System Memory Map" gives base, size and the Executable column: TCM
            0x10000000-0x1000FFFF, main SRAM 0x10010000-0x100BFFFF ("SRAM increase from
            320KB to 704KB"), flash 0x00000000-0x001FFFFF. No region is mapped twice.
      sram:
        technology: sram
        attachment: system
        base: 0x10010000
        size: 704K
        executable: true
        provenance: *ds_map
      flash:
        technology: flash
        attachment: system
        base: 0x00000000
        size: 2M
        executable: true
        provenance: *ds_map

    default_access:
      master: cm4_0
      access: direct
      scope: on_die
      provenance:
        status: datasheet
        source: ["doc:DS-A3P@1.3.0:p82"]
        verified_on: 2026-10-08
        verified_by: evanchen11
        notes: Table 5 is the Cortex-M4 memory map, and every region is in it.

    # Each name carries its record, so the names Table 6 lacks can cite the SDK alone.
    peripherals:
      - value: adc
        provenance: &table6
          status: datasheet
          source:
            - "doc:DS-A3P@1.3.0:p83-84"
            - "repo:AmbiqAI/nsx-ambiq-sdk@v5.2.26:modules/nsx-ambiqsuite/sdk/CMSIS/AmbiqMicro/Include/apollo3p.h:9842-9869"
          verified_on: 2026-10-26
          verified_by: evanchen11
          notes: >-
            Table 6 "MCU Peripheral Device Memory Map" lists the block. Its names are
            descriptive ("I2C / SPI Master0", "MSPI0 Master"), so the ids are the CMSIS
            header's <NAME>_BASE names, lowercased.
      - value: apbdma
        provenance:
          status: sdk
          source: ["repo:AmbiqAI/nsx-ambiq-sdk@v5.2.26:modules/nsx-ambiqsuite/sdk/CMSIS/AmbiqMicro/Include/apollo3p.h:9843"]
          verified_on: 2026-10-26
          verified_by: evanchen11
          notes: APBDMA_BASE 0x40011000, which DS-A3P Table 6 names "Fast GPIO Control" (p83).
      - {value: bleif, provenance: *table6}
      - {value: cachectrl, provenance: *table6}
      - {value: clkgen, provenance: *table6}
      - {value: ctimer, provenance: *table6}
      - {value: gpio, provenance: *table6}
      - {value: iom0, provenance: *table6}
      - {value: iom1, provenance: *table6}
      - {value: iom2, provenance: *table6}
      - {value: iom3, provenance: *table6}
      - {value: iom4, provenance: *table6}
      - {value: iom5, provenance: *table6}
      - {value: ioslave, provenance: *table6}
      - {value: mcuctrl, provenance: *table6}
      - {value: mspi0, provenance: *table6}
      - {value: mspi1, provenance: *table6}
      - {value: mspi2, provenance: *table6}
      - {value: pdm, provenance: *table6}
      - {value: pwrctrl, provenance: *table6}
      - {value: rstgen, provenance: *table6}
      - {value: rtc, provenance: *table6}
      - {value: scard, provenance: *table6}
      - value: security
        provenance:
          status: sdk
          source: ["repo:AmbiqAI/nsx-ambiq-sdk@v5.2.26:modules/nsx-ambiqsuite/sdk/CMSIS/AmbiqMicro/Include/apollo3p.h:9865"]
          verified_on: 2026-10-26
          verified_by: evanchen11
          notes: SECURITY_BASE 0x40030000, which DS-A3P Table 6 shows as Reserved (p83).
      - {value: uart0, provenance: *table6}
      - {value: uart1, provenance: *table6}
      - {value: vcomp, provenance: *table6}
      - {value: wdt, provenance: *table6}
    memory_controllers:
      value: [mspi0, mspi1, mspi2]
      provenance:
        status: datasheet
        source: ["doc:DS-A3P@1.3.0:p82"]
        verified_on: 2026-10-26
        verified_by: evanchen11
        notes: >-
          Table 5 gives each MSPI an XIP window and a read/write aperture. IOMs have no
          memory aperture.

    clock_domains:
      cpu:
        lp:
          mhz: 48
          hal_mode:
            value: AM_HAL_NORMAL_MODE
            provenance: &hal_burst
              status: sdk
              source: ["repo:AmbiqAI/nsx-ambiq-sdk@v5.2.26:modules/nsx-ambiqsuite/sdk/mcu/apollo3p/hal/am_hal_burst.h:67-68"]
              verified_on: 2026-10-26
              verified_by: evanchen11
              notes: am_hal_burst_mode_e, AM_HAL_BURST_MODE (:67) and AM_HAL_NORMAL_MODE (:68).
          provenance: &ds_clk
            status: datasheet
            source: ["doc:DS-A3P@1.3.0:p2"]
            verified_on: 2026-10-08
            verified_by: evanchen11
            notes: '"48 MHz nominal clock frequency, with 96 MHz high performance TurboSPOT Mode".'
        hp:
          mhz: 96
          hal_mode:
            value: AM_HAL_BURST_MODE
            provenance: *hal_burst
          provenance: *ds_clk
    operating_points:
      lp: {domains: {cpu: lp}, provenance: *ds_clk}
      hp: {domains: {cpu: hp}, provenance: *ds_clk}
    default_operating_point:
      value: lp
      provenance:
        status: sdk
        source:
          - "repo:AmbiqAI/nsx-ambiq-sdk@v5.2.26:modules/nsx-core/includes-api/nsx_system.h:188"
          - "repo:AmbiqAI/nsx-ambiq-sdk@v5.2.26:modules/nsx-core/src/apollo3p/nsx_system_platform.c:46-51"
        verified_on: 2026-10-26
        verified_by: evanchen11
        notes: >-
          A zero-initialised config is "minimal, low-power"; on Apollo3
          nsx_platform_set_perf_mode is a no-op, so nsx never leaves 48 MHz.

    boot_configs:
      sbl:
        reserved:
          sbl:
            region: flash
            offset: 0
            size: 48K
            provenance:
              status: derived
              source:
                - "fact:soc:apollo3p:boot_configs.sbl.app_start.cm4_0.offset"
                - "fact:soc:apollo3p:memories.flash.base"
              verified_on: 2026-10-26
              verified_by: evanchen11
              notes: >-
                Everything below the application start: 0xC000 - 0x00000000 (the flash base)
                = 48K. No datasheet page states it; DS-A3P p177 describes a reset vector at
                flash offset 0 for the path without the SBL.
        app_start:
          region: flash
          offset: 48K
          provenance:
            status: sdk
            source:
              - "repo:AmbiqAI/nsx-ambiq-sdk@v5.2.26:modules/nsx-ambiqsuite/sdk/mcu/apollo3p/hal/am_hal_flash.h:93"
              - "repo:AmbiqAI/nsx-ambiq-sdk@v5.2.26:modules/nsx-core/src/apollo3p/gcc/linker_script.ld:10"
              - "repo:AmbiqAI/nsx-ambiq-sdk@v5.2.26:modules/nsx-core/src/apollo3p/armclang/linker_script.sct:6-8"
              - "repo:AmbiqAI/nsx-ambiq-sdk@v5.2.26:cmake/socs/facts/apollo3p.cmake:51"
            verified_on: 2026-10-26
            verified_by: evanchen11
            notes: >-
              AM_HAL_FLASH_APPL_ADDR 0xC000, both linker scripts and NSX_SEGGER_PF_ADDR; the
              flash base is 0, so the offset is the address. Zephyr's apollo3p_evb flash
              node starts at 0xc000. No datasheet page states it.
        requires: sbl
        provenance:
          status: datasheet
          source: ["doc:DS-A3P@1.3.0:p177"]
          verified_on: 2026-10-08
          verified_by: evanchen11
          notes: '"Secure boot, if enabled, will be invoked on each boot and reset cycle."'
    default_boot:
      value: sbl
      provenance:
        status: sdk
        source:
          - "repo:AmbiqAI/nsx-ambiq-sdk@v5.2.26:cmake/socs/apollo3p.cmake:21"
          - "repo:AmbiqAI/nsx-ambiq-sdk@v5.2.26:cmake/socs/apollo3p.cmake:24"
        verified_on: 2026-10-26
        verified_by: evanchen11
        notes: The only scripts the SDK selects, armclang (:21) and gcc (:24), start at 0xC000.

    sdk:
      c_define: AM_PART_APOLLO3P
      provenance:
        status: sdk
        source: ["repo:AmbiqAI/nsx-ambiq-sdk@v5.2.26:cmake/socs/facts/apollo3p.cmake:32"]
        verified_on: 2026-10-26
        verified_by: evanchen11
      cmsis_header:
        value: apollo3p.h
        provenance:
          status: sdk
          source: ["repo:AmbiqAI/nsx-ambiq-sdk@v5.2.26:modules/nsx-ambiqsuite/sdk/mcu/apollo3p/am_mcu_apollo.h:73"]
          verified_on: 2026-10-26
          verified_by: evanchen11
      trace_clock_mhz:
        value: 6
        provenance:
          status: measured
          source:
            - "meas:apollo3p_evb/swo-acpr-sweep/2026-10-28"
            - "url:https://github.com/AmbiqAI/helia-platforms/issues/67#issuecomment-6477434661"
            - "repo:AmbiqAI/nsx-ambiq-sdk@v5.2.26:modules/nsx-ambiqsuite/sdk/lib/gcc/apollo3p/libam_hal.a"
            - "repo:AmbiqAI/nsx-ambiq-sdk@v5.2.26:modules/nsx-ambiqsuite/sdk/CMSIS/AmbiqMicro/Include/apollo3p.h:26263"
            - "doc:DS-A3P@1.3.0:p159-160"
            - "doc:DS-A3P@1.3.0:p627"
          verified_on: 2026-10-28
          verified_by: evanchen11
          notes: >-
            On apollo3p_evb, TPIUCTRL reads 0x201 (CLKSEL HFRCDIV8) and SWO decodes at 1 Mbaud
            only with ACPR 5, so the TPIU clock is 6 MHz, HFRC/8 of the 48 MHz HFRC (p627).
            J-Link's Apollo3 support takes its CPU-speed argument as the HFRC and divides by
            8 itself, so NSX_SEGGER_CPUFREQ's 48 MHz (apollo3p.cmake:52) is what J-Link needs.
            Measured at the 48 MHz lp clock, not in burst mode.
      build:
        abi: thumbv7em-fpv4sp-hard
        float_abi: hard
        provenance:
          status: sdk
          source:
            - "repo:AmbiqAI/nsx-ambiq-sdk@v5.2.26:cmake/socs/facts/apollo3p.cmake:22"
            - "repo:AmbiqAI/nsx-ambiq-sdk@v5.2.26:cmake/socs/facts/apollo3p.cmake:26"
          verified_on: 2026-10-26
          verified_by: evanchen11

parts:
  AMA3B2KK-KBR:
    release_status: public
    soc: apollo3p
    package: 108-pin BGA
    radio:
      value: ble-5
      provenance:
        status: datasheet
        source: ["doc:DS-A3P@1.3.0:p2"]
        verified_on: 2026-10-08
        verified_by: evanchen11
        notes: '"Integrated Bluetooth 5 low-energy controller". p1032 has no BLE column.'
    jlink_device:
      value: AMA3B2KK-KBR
      provenance:
        status: sdk
        source: ["repo:AmbiqAI/nsx-ambiq-sdk@v5.2.26:cmake/socs/facts/apollo3p.cmake:49"]
        verified_on: 2026-10-26
        verified_by: evanchen11
        notes: >-
          The SDK's SoC-level default; Zephyr's apollo3p_evb board.cmake:4 passes the same
          device. Not checked against SEGGER's device list (#19).
    provenance:
      status: datasheet
      source: ["doc:DS-A3P@1.3.0:p1032"]
      verified_on: 2026-10-08
      verified_by: evanchen11
      notes: Table 1643 "Ordering Information" gives the part and its 108-pin BGA package.

boards:
  apollo3p_evb:
    release_status: public
    category: evaluation
    revision: "1.0"
    part: AMA3B2KK-KBR
    aliases: [apollo3_blue_plus_evb]
    provenance:
      status: datasheet
      source: ["doc:QS-A3BP@1.2:p5", "doc:QS-A3BP@1.2:p7"]
      verified_on: 2026-10-08
      verified_by: evanchen11
      notes: >-
        p5 "Apollo3 Blue Plus Evaluation Board (EVB), part number AMA3B2EVB, revision 1.0";
        p7 "Apollo3 Blue Plus SoC in the BGA package (AMA3B2KK-KBR)". The guide names no
        external memory: the PSRAM comes with the cygnus add-on. The alias is heliaAOT's.
    interfaces:
      mspi1:
        controller:
          value: mspi1
          provenance:
            status: sdk
            source: ["repo:AmbiqAI/nsx-ambiq-sdk@v5.2.26:modules/nsx-ambiqsuite/sdk/boards/apollo3p_evb/bsp/am_bsp_pins.h:527-621"]
            verified_on: 2026-10-26
            verified_by: evanchen11
            notes: The BSP routes MSPI1 CE0 and CE1, D0-D7, SCK and DQS (pads 50-62).
        aperture_base: 0x04000000
        alternate_bases:
          value: [0x54000000]
          provenance:
            status: datasheet
            source: ["doc:DS-A3P@1.3.0:p82", "doc:DS-A3P@1.3.0:p244", "doc:DS-A3P@1.3.0:p249"]
            verified_on: 2026-10-28
            verified_by: evanchen11
            notes: >-
              The MSPI1 XIPMM window, 0x54000000-0x55FFFFFF (p82, p249), also Zephyr's XIP1
              node. p244: XIP is cached and read-only, XIPMM "direct read/write accesses
              (non-cached)"; p249: writes through XIP "do not flush cached data".
        aperture_max: 32M
        provenance:
          status: datasheet
          source: ["doc:DS-A3P@1.3.0:p82"]
          verified_on: 2026-10-08
          verified_by: evanchen11
          notes: >-
            "0x04000000 - 0x05FFFFFF External XiP Memory1 Y External XIP Memory (MSPI1)"; the
            register header's MSPI1_XIP_BASEADDR agrees.
    provisioning:
      value: sbl
      provenance:
        status: datasheet
        source: ["doc:QS-A3BP@1.2:p8"]
        verified_on: 2026-10-08
        verified_by: evanchen11
        notes: '"preprogrammed with a Secure Bootloader".'
