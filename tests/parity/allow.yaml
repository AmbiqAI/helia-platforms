      neuralspotx's debug.cmake sets Apollo330P_510L, a custom device that only an
      Ambiq device file defines; the catalog records no J-Link device until an official
      name exists (#130).
    issue: "#130"
  - consumer: neuralspotx
    target: apollo3_evb
    field: trace_clock_mhz
