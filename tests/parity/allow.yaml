  - consumer: neuralspotx
    target: apollo510dL_evb
    field: jlink_device
    reason: >-
      neuralspotx uses the SDK's AP510DLA-CBR (facts/apollo510L.cmake:50), which
      is not in SEGGER's stock database and failed on the bench; the catalog records no
      J-Link device until an official name exists (#130).
    issue: "#130"
  - consumer: neuralspotx
    target: apollo330mP_evb
    field: jlink_device
