      The catalog's trace clock is the physical TPIU clock, HFRC/8, 6 MHz, the clock the
      HAL selects; it is unverified on apollo3, measured only on apollo3p_evb (#67).
      neuralspotx passes NSX_SEGGER_CPUFREQ, 48 MHz, the HFRC that J-Link's Apollo3
      support divides by 8.
    issue: "#67"
  - consumer: neuralspotx
