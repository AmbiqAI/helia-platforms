# Parity with each consumer's current data (#13; RFC 0002 0002-migration.md). Each
# consumer's file is a verbatim copy at `commit`. An allowed difference names the
# target, the field, a reason and an issue; an entry that no longer differs fails.
consumers:
  helia-aot:
    repository: AmbiqAI/helia-aot
    commit: d31bf2226e58e4120eaf8e6da289b5ee91e2e06b
    path: docs/src/data/generated/targets.json
  # Not a verbatim file: each board's effective facts at the last revision before
  # neuralspotx consumed the catalog, frozen from the snapshots (#18; ADR 0006).
  neuralspotx:
    repository: AmbiqAI/neuralspotx
    commit: ffb7339b14b00134b4ed2834a1640d61042c0962
    path: tests/parity/neuralspotx/boards.json
