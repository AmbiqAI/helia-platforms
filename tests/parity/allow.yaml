# Parity with each consumer's current data (#13; RFC 0002 0002-migration.md). Each
# consumer's file is a verbatim copy at `commit`. An allowed difference names the
# target, the field, a reason and an issue; an entry that no longer differs fails.
consumers:
  helia-aot:
    repository: AmbiqAI/helia-aot
    commit: d31bf2226e58e4120eaf8e6da289b5ee91e2e06b
    path: docs/src/data/generated/targets.json
  # Not a verbatim file: each board's effective facts at the last revision before
  # neuralspotx consumed the catalog, frozen from the snapshots (#18; ADR 0006).
  neuralspotx:
    repository: AmbiqAI/neuralspotx
    commit: ffb7339b14b00134b4ed2834a1640d61042c0962
    path: tests/parity/neuralspotx/boards.json
allowed:
  - consumer: helia-aot
    target: apollo510_evb
    field: memories.DTCM
    reason: >-
      RAM budgets are physical sizes: DTCM goes from the nsx gcc sbl script's 507904
      bytes to the physical 524288 (0002-migration.md, heliaAOT budgets).
    issue: "#28"
  - consumer: helia-aot
    target: apollo3_blue_evb
    field: memories.MRAM
    reason: &a3_mram >-
      NVM budgets are usable_nvm(): 1048576 bytes of flash less the 48 KB below the
      0xC000 application start, 999424 (0002-migration.md, heliaAOT budgets).
    issue: "#28"
  - consumer: helia-aot
    target: apollo3_blue_thin_evb
    field: memories.MRAM
    reason: *a3_mram
    issue: "#28"
  - consumer: helia-aot
    target: apollo3_evb
    field: memories.MRAM
    reason: *a3_mram
    issue: "#28"
  - consumer: helia-aot
    target: apollo3_blue_plus_evb
    field: memories.MRAM
    reason: &a3p_mram >-
      NVM budgets are usable_nvm(): 2097152 bytes of flash less the 48 KB below the
      0xC000 application start, 2048000 (0002-migration.md, heliaAOT budgets).
    issue: "#28"
  - consumer: helia-aot
    target: apollo3p_evb
    field: memories.MRAM
    reason: *a3p_mram
    issue: "#28"
  - consumer: helia-aot
    target: apollo3_blue_evb
    field: memories.DTCM
    reason: &a3_tcm >-
      The catalog names Apollo3's one TCM region tcm (DS-A3 and DS-A3P Table 5) where
      heliaAOT says DTCM. This projection keys a TCM by its name; the adapter maps it.
    issue: "#13"
  - consumer: helia-aot
    target: apollo3_blue_evb
    field: memories.TCM
    reason: *a3_tcm
    issue: "#13"
  - consumer: helia-aot
    target: apollo3_blue_plus_evb
    field: memories.DTCM
    reason: *a3_tcm
    issue: "#13"
  - consumer: helia-aot
    target: apollo3_blue_plus_evb
    field: memories.TCM
    reason: *a3_tcm
    issue: "#13"
  - consumer: helia-aot
    target: apollo3_blue_thin_evb
    field: memories.DTCM
    reason: *a3_tcm
    issue: "#13"
  - consumer: helia-aot
    target: apollo3_blue_thin_evb
    field: memories.TCM
    reason: *a3_tcm
    issue: "#13"
  - consumer: helia-aot
    target: apollo3_evb
    field: memories.DTCM
    reason: *a3_tcm
    issue: "#13"
  - consumer: helia-aot
    target: apollo3_evb
    field: memories.TCM
    reason: *a3_tcm
    issue: "#13"
  - consumer: helia-aot
    target: apollo3p_evb
    field: memories.DTCM
    reason: *a3_tcm
    issue: "#13"
  - consumer: helia-aot
    target: apollo3p_evb
    field: memories.TCM
    reason: *a3_tcm
    issue: "#13"
