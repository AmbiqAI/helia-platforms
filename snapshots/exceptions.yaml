# Disagreements between the catalog and these snapshots that check-sources
# (#72) accepts (ADR 0006 section 3). Each entry names a snapshot file, the key
# path of the value or group in it, the comparison rule it fails, a reason and
# the issue that tracks the fix. Remove an entry when its issue is fixed.
exceptions:
  # The nbl and itcm_sbl scripts carry apollo510's sizes: MCU_TCM is 507904
  # bytes (gcc) and 503808 (armclang) against a 256 KB DTCM, and MCU_MRAM and
  # SHARED_SRAM exceed the 2 MB MRAM and 1.75 MB SSRAM the register headers give.
  - snapshot: nsx-ambiq-sdk.json
    at: [socs, apollo330P, linker, gcc, scripts, linker_script_itcm_sbl.ld]
    rule: region containment
    reason: Declares apollo510-sized memory regions.
    issue: AmbiqAI/nsx-ambiq-sdk#60
  - snapshot: nsx-ambiq-sdk.json
    at: [socs, apollo330P, linker, gcc, scripts, linker_script_nbl.ld]
    rule: region containment
    reason: Declares apollo510-sized memory regions.
    issue: AmbiqAI/nsx-ambiq-sdk#60
  - snapshot: nsx-ambiq-sdk.json
    at: [socs, apollo330P, linker, armclang, scripts, linker_script_itcm_sbl.sct]
    rule: region containment
    reason: Declares apollo510-sized memory regions.
    issue: AmbiqAI/nsx-ambiq-sdk#60
  - snapshot: nsx-ambiq-sdk.json
    at: [socs, apollo330P, linker, armclang, scripts, linker_script_nbl.sct]
    rule: region containment
    reason: Declares apollo510-sized memory regions.
    issue: AmbiqAI/nsx-ambiq-sdk#60
  - snapshot: nsx-ambiq-sdk.json
    at: [socs, apollo510L, linker, gcc, scripts, linker_script_itcm_sbl.ld]
    rule: region containment
    reason: Declares apollo510-sized memory regions.
    issue: AmbiqAI/nsx-ambiq-sdk#60
  - snapshot: nsx-ambiq-sdk.json
    at: [socs, apollo510L, linker, gcc, scripts, linker_script_nbl.ld]
    rule: region containment
    reason: Declares apollo510-sized memory regions.
    issue: AmbiqAI/nsx-ambiq-sdk#60
  - snapshot: nsx-ambiq-sdk.json
    at: [socs, apollo510L, linker, armclang, scripts, linker_script_itcm_sbl.sct]
    rule: region containment
    reason: Declares apollo510-sized memory regions.
    issue: AmbiqAI/nsx-ambiq-sdk#60
  - snapshot: nsx-ambiq-sdk.json
    at: [socs, apollo510L, linker, armclang, scripts, linker_script_nbl.sct]
    rule: region containment
    reason: Declares apollo510-sized memory regions.
    issue: AmbiqAI/nsx-ambiq-sdk#60

  # The catalog puts the Blue Plus parts on apollo4p, as nsx-ambiq-sdk and neuralspotx
  # do (decided on #66); Zephyr names a Soc of their own.
  - snapshot: zephyr.json
    at: [boards, apollo4p_blue_kxr_evb, board, values, soc]
    rule: board soc
    reason: "Zephyr's apollo4p_blue Soc is apollo4p as the Blue Plus implementations realize it."
    issue: "#129"
  # The catalog's trace clock is the TPIU clock the HAL selects, HFRC48 (decided on #66);
  # NSX_SEGGER_CPUFREQ is the J-Link setting.
  - snapshot: nsx-ambiq-sdk.json
    at: [socs, apollo4p, facts, values, NSX_SEGGER_CPUFREQ]
    rule: trace clock
    reason: "am_hal_tpiu_enable clocks the TPIU from HFRC48; 96 MHz is J-Link's setting (#19)."
    issue: "#19"
  - snapshot: nsx-ambiq-sdk.json
    at: [socs, apollo4l, facts, values, NSX_SEGGER_CPUFREQ]
    rule: trace clock
    reason: "am_hal_tpiu_enable clocks the TPIU from HFRC48; 96 MHz is J-Link's setting (#19)."
    issue: "#19"
  # apollo3 and apollo3p differences that are not data errors (#67).
  - snapshot: zephyr.json
    at: [boards, apollo3_evb, board, values, soc]
    rule: board soc
    reason: Zephyr names the Apollo3 Blue SoC apollo3_blue; nsx-ambiq-sdk and the catalog name it apollo3.
    issue: "#129"
  - snapshot: zephyr.json
    at: [boards, apollo3p_evb, board, values, soc]
    rule: board soc
    reason: Zephyr names the Apollo3 Blue Plus SoC apollo3p_blue; nsx-ambiq-sdk and the catalog name it apollo3p.
    issue: "#129"
  - snapshot: zephyr.json
    at: [boards, apollo3p_evb, devicetree, memory, /memory@52000000]
    rule: region containment
    reason: &xipmm >-
      An MSPI read/write (XIPMM) aperture, external memory (DS-A3P p82). The Zephyr check
      looks apertures up by Zephyr's SoC name, apollo3p_blue, which matches no SDK Soc;
      and apollo3p's register header gives only the XIPMM base, with no end define.
      Both must change before these entries can go.
    issue: "#129"
  - snapshot: zephyr.json
    at: [boards, apollo3p_evb, devicetree, memory, /memory@54000000]
    rule: region containment
    reason: *xipmm
    issue: "#129"
  - snapshot: zephyr.json
    at: [boards, apollo3p_evb, devicetree, memory, /memory@56000000]
    rule: region containment
    reason: *xipmm
    issue: "#129"
  - snapshot: nsx-ambiq-sdk.json
    at: [socs, atomiq110, facts, values, NSX_SEGGER_CPUFREQ]
    rule: trace clock
    reason: >-
      atomiq110's NSX_SEGGER_CPUFREQ (25 MHz) is the FPGA image's clock, not a trace clock,
      so the Soc records none. The FPGA's measured 50 MHz is on atomiq110_fpga (RFC 0002).
    issue: "#68"

  # These stay as long as the catalog leaves apollo2 and apollo5b out.
  - snapshot: nsx-ambiq-sdk.json
    at: [socs, apollo2]
    rule: in the catalog
    reason: "The catalog leaves apollo2 out, decided 2026-10-19 on #79."
    issue: "#79"
  - snapshot: zephyr.json
    at: [boards, apollo2_evb]
    rule: in the catalog
    reason: "The catalog leaves apollo2 out, decided 2026-10-19 on #79."
    issue: "#79"
  - snapshot: nsx-ambiq-sdk.json
    at: [socs, apollo5b]
    rule: in the catalog
    reason: >-
      The catalog leaves apollo5b out, decided 2026-10-07 on #64: no datasheet, guide or
      ordering number exists. #79 records the decision.
    issue: "#79"
