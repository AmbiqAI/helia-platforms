[project]
name = "helia-platforms"
version = "0.1.0"
description = "Shared catalog of Ambiq SoC and board facts (cores, memories, clocks, NPU, debug-probe identifiers) consumed by heliaAOT, helia-profiler and helia-estimator."
readme = "README.md"
license-files = ["LICENSE.md"]
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0", "typer>=0.16"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.scripts]
helia-platforms = "helia_platforms.cli:main"

[project.urls]
Repository = "https://github.com/AmbiqAI/helia-platforms"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.11",
    "ty",
    "pre-commit>=4",
    "jsonschema>=4.23",
    { include-group = "extract" },
]
# The snapshot extractor's dependencies (ADR 0006), outside the wheel's runtime ones.
extract = ["pcpp>=1.30"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "PL"]
ignore = ["PLR2004", "PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101"]

[tool.ruff.format]
quote-style = "double"
exclude = ["docs/**"]

[tool.ty.environment]
python-version = "3.11"
extra-paths = ["scripts"]

[tool.ty.src]
include = ["src", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = "-ra -q"

[tool.coverage.run]
source = ["helia_platforms", "scripts"]
