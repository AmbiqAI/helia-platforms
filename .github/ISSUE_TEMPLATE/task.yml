name: Task
description: A scoped piece of work with acceptance criteria.
body:
  - type: textarea
    id: what
    attributes:
      label: What
      description: What needs to be done.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: The motivation, and who needs it.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checkable conditions that mean this is done.
      placeholder: |
        - [ ] ...
    validations:
      required: true
