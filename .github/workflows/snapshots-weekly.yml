name: Snapshot drift

# ADR 0006 section 1. Step 1 re-extracts at each recorded revision; step 2
# extracts the newest nsx-ambiq-sdk tag and Zephyr main, and diffs the values
# against the snapshots. neuralspotx is a consumer, so it stays at its pin (#18). Both report to the issue numbered by
# the repository variable SNAPSHOT_TRACKING_ISSUE. GitHub disables a public
# repository's scheduled workflows after 60 days without activity.

on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  # Step 2 runs upstream code (Zephyr's dtlib), so extraction holds no token
  # (ADR 0006 section 1); only the report job's two gh steps get one.
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mention: ${{ steps.owners.outputs.mention }}
      step1: ${{ steps.step1.outcome }}
      hash: ${{ steps.step2.outputs.hash }}
      status: ${{ steps.step2.outputs.status }}
    steps:
      - name: Require the tracking issue variable
        env:
          ISSUE: ${{ vars.SNAPSHOT_TRACKING_ISSUE }}
        run: |
          if [ -z "$ISSUE" ]; then
            echo "::error::Set the repository variable SNAPSHOT_TRACKING_ISSUE to the tracking issue's number."
            exit 1
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - run: uv sync --locked --no-dev --group extract
      - name: Find the snapshot directory's code owners
        id: owners
        run: |
          owners="$(awk '$1 == "/snapshots/" { $1 = ""; line = $0 } END { print line }' .github/CODEOWNERS)"
          echo "mention=$(echo $owners)" >> "$GITHUB_OUTPUT"

      - name: "Step 1: re-extract at each recorded revision"
        id: step1
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/report"
          uv run --no-sync python scripts/extract_snapshots.py extract --check --at revision \
            > "$RUNNER_TEMP/report/step1.txt" 2>&1 || { cat "$RUNNER_TEMP/report/step1.txt"; exit 1; }
          cat "$RUNNER_TEMP/report/step1.txt"

      - name: "Step 2: extract upstream main and diff against the snapshots"
        id: step2
        run: |
          mkdir -p "$RUNNER_TEMP/report"
          status=0
          sdk="$(git ls-remote --tags --refs --sort=-v:refname \
            https://github.com/AmbiqAI/nsx-ambiq-sdk 'v*' | head -n 1 | sed 's|.*refs/tags/||')"
          if [ -z "$sdk" ]; then
            echo "error: no nsx-ambiq-sdk v* tag found" > "$RUNNER_TEMP/step2.txt"
            status=1
          else
            uv run --no-sync python scripts/extract_snapshots.py extract --at revision \
              --sdk "$sdk" --zephyr main --output "$RUNNER_TEMP/main" \
              > "$RUNNER_TEMP/step2.txt" 2>&1 || status=$?
          fi
          cat "$RUNNER_TEMP/step2.txt"
          # Commits move every week; only value changes and failures are reported.
          grep -v ' metadata > ' "$RUNNER_TEMP/step2.txt" | grep -E '^(  [-+~] |error: )' \
            > "$RUNNER_TEMP/report/drift.txt" || true
          if [ "$status" -ne 0 ] && [ ! -s "$RUNNER_TEMP/report/drift.txt" ]; then
            cp "$RUNNER_TEMP/step2.txt" "$RUNNER_TEMP/report/drift.txt"
          fi
          echo "hash=$(sha256sum "$RUNNER_TEMP/report/drift.txt" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: snapshot-drift
          path: ${{ runner.temp }}/report/
          retention-days: 7

  report:
    needs: extract
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_REPO: ${{ github.repository }}
      ISSUE: ${{ vars.SNAPSHOT_TRACKING_ISSUE }}
      MENTION: ${{ needs.extract.outputs.mention }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: snapshot-drift
          path: report
      - name: Report the step 1 failure
        if: needs.extract.outputs.step1 == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Weekly snapshot check, step 1: re-extracting at the recorded revisions failed."
            echo "A tag may now resolve to another commit, or the extractor no longer reads a source."
            echo
            echo '```'
            head -c 60000 report/step1.txt
            echo '```'
            echo
            echo "Run: $RUN_URL"
            echo "cc $MENTION"
          } > "$RUNNER_TEMP/step1.md"
          gh issue comment "$ISSUE" --body-file "$RUNNER_TEMP/step1.md"
      - name: Report a new step 2 diff
        env:
          GH_TOKEN: ${{ github.token }}
          HASH: ${{ needs.extract.outputs.hash }}
          STATUS: ${{ needs.extract.outputs.status }}
        run: |
          if [ ! -s report/drift.txt ]; then
            echo "No drift from upstream main."
            exit 0
          fi
          last="$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE/comments" --paginate \
            --jq '.[].body' | grep -o 'snapshot-drift sha256:[0-9a-f]*' | tail -n 1 | cut -d: -f2)"
          if [ "$last" = "$HASH" ]; then
            echo "The diff matches the last one posted ($HASH)."
            exit 0
          fi
          {
            if [ "$STATUS" -ne 0 ]; then
              echo "Weekly snapshot check, step 2: extracting upstream main failed."
            else
              echo "Weekly snapshot check, step 2: upstream main differs from the snapshots."
            fi
            echo
            echo '```diff'
            head -c 60000 report/drift.txt
            echo '```'
            echo
            echo "Run: $RUN_URL"
            echo "cc $MENTION"
            echo
            echo "<!-- snapshot-drift sha256:$HASH -->"
          } > "$RUNNER_TEMP/step2.md"
          gh issue comment "$ISSUE" --body-file "$RUNNER_TEMP/step2.md"

      - name: Fail the run when step 1 failed
        if: needs.extract.outputs.step1 == 'failure'
        run: exit 1
