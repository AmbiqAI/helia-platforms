name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: python
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Uploads to PyPI only once the repository variable is set (#5); until then a
  # release creates the tag and GitHub release only.
  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' && vars.HELIA_PLATFORMS_PYPI_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # --frozen, not --locked: release-please bumps pyproject.toml but not the
      # project's own version in uv.lock, which --locked would reject.
      - run: uv sync --frozen --group dev
      - run: uv run --frozen pytest tests/test_distributions.py
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
